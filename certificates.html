<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generate Certificates - Sacramento Suzuki</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
    <div class="card">
        <h1>Generate Certificates</h1>
        <p class="page-description">Copy all data from the spreadsheet and paste it into the text field below.</p>

        <div id="formContainer">
            <div class="form-group">
                <label for="spreadsheetData">Spreadsheet Data</label>
                <textarea id="spreadsheetData" placeholder="Paste spreadsheet data here..."></textarea>
            </div>

            <button type="button" id="generateBtn" disabled>Generate</button>
        </div>
    </div>
    <script src="certificates.js"></script>
</body>
</html>
